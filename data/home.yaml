quote:
  titleHTML: La citation du <strong>Dalaï-Lama</strong>
  textHTML: <span class="drop_cap">« C</span>e qui me surprend le plus dans l’humanité, ce sont les hommes eux-mêmes parce que d’abord ils perdent la santé pour accumuler de l’argent et ensuite ils perdent de l’argent pour retrouver la santé. Et à penser anxieusement au futur, ils oublient le présent de telle façon qu’ils finissent par vivre ni le présent, ni le futur. Ils vivent comme s’ils n’allaient jamais mourir et meurent comme s’ils n’avaient jamais vécu. »

testimonials:
  url: ressources/livre-d-or/
  items:
    - textHTML: Fabienne a toujours été là quand j’en ai eu besoin. En écoutant et appliquant ses conseils j’ai eu des résultats extraordinaires. Un grand merci !
      author: Simon Olivetta
      location: Vufflens-la-Ville
    - textHTML: Je remercie vraiment Fabienne qui m’a écoutée, entendue, guidée, soutenue et qui m’a surtout permit d’aller beaucoup mieux.
      author: Laure
      location: Sion
    - textHTML: Fidèle depuis 16 ans, je peux dire que du bien sur Fabienne. Merci beaucoup pour ton super travail !
      author: Annette
      location: Cugy
    - textHTML: Une poigne de fer dans un gant de velours, sauf quand tu utilises ta “matraque” !<br>Sans toi, il y a déjà longtemps que mes bras auraient touché le sol à force d’avoir le dos bloqué.
      author: Christine
      location: Bioley-Orjulaz

